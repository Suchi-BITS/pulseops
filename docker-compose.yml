# PulseOps local platform (Gate 9) - CANONICAL compose file.
#
#   n8n container --(pulseops-net)--> pulseops service (http://pulseops:8000)
#
# Local application hardening only: no cloud, no PostgreSQL, no Kubernetes. SQLite lives on the pulseops_data volume
# mounted at /data. PulseOps does not consume Neo4j at runtime (see docker-compose.neo4j.yml for the optional,
# currently unused local Neo4j container).
#
# Secrets come from the environment / an env file (`docker compose --env-file ...`), never from this file:
#   PULSEOPS_API_CREDENTIALS  JSON list of credential entries holding SHA-256 hashes only (see .env.example)
#   PULSEOPS_N8N_TOKEN        plaintext bearer token of the service_n8n principal (its hash is in the list above)
#   N8N_WEBHOOK_SECRET        shared secret that event sources must send to the n8n webhook
#   N8N_ENCRYPTION_KEY        n8n credential-store encryption key
#   ANTHROPIC_API_KEY         optional; without it every investigation fails closed
#
# Start:  docker compose --env-file .env up -d --build
name: pulseops

services:
  pulseops:
    build: .
    image: pulseops:gate9
    container_name: pulseops-app
    environment:
      # `development` enables the demo seed data; use `production` for a seed-free, auth-only deployment.
      PULSEOPS_ENVIRONMENT: ${PULSEOPS_ENVIRONMENT:-development}
      PULSEOPS_AUTH_MODE: apikey
      PULSEOPS_API_CREDENTIALS: ${PULSEOPS_API_CREDENTIALS:?set PULSEOPS_API_CREDENTIALS (JSON list of credential hashes)}
      PULSEOPS_DATABASE_URL: sqlite:////data/pulseops.db
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      CLAUDE_MODEL: ${CLAUDE_MODEL:-claude-sonnet-4-20250514}
    ports:
      - "127.0.0.1:${PULSEOPS_PORT:-8000}:8000"
    volumes:
      - pulseops_data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=3).read()"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - pulseops-net
    restart: unless-stopped

  n8n:
    image: docker.n8n.io/n8nio/n8n:2.41.6
    container_name: pulseops-n8n
    depends_on:
      pulseops:
        condition: service_healthy
    entrypoint: ["/bin/sh", "/n8n/bootstrap.sh"]
    environment:
      N8N_HOST: localhost
      WEBHOOK_URL: http://localhost:5678/
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY:?set N8N_ENCRYPTION_KEY}
      PULSEOPS_N8N_TOKEN: ${PULSEOPS_N8N_TOKEN:?set PULSEOPS_N8N_TOKEN}
      N8N_WEBHOOK_SECRET: ${N8N_WEBHOOK_SECRET:?set N8N_WEBHOOK_SECRET}
      N8N_BLOCK_ENV_ACCESS_IN_NODE: "true"
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_PERSONALIZATION_ENABLED: "false"
      GENERIC_TIMEZONE: UTC
    ports:
      - "127.0.0.1:5678:5678"
    volumes:
      - n8n_data:/home/node/.n8n
      - ./n8n:/n8n:ro
    networks:
      - pulseops-net
    restart: unless-stopped

networks:
  pulseops-net:
    name: pulseops-net

volumes:
  pulseops_data:
  n8n_data:
