# LEGACY standalone n8n for Phase 7 Gate 6 (kept temporarily; superseded by docker-compose.yml in Gate 9).
#
# The canonical local platform is docker-compose.yml (PulseOps + n8n on a Docker network, authenticated, pinned).
# This file is retained only until the replacement has been used in practice. It no longer matches the workflow in
# n8n/pulseops-event-workflow.json (which now calls http://pulseops:8000 with credentials), so it cannot run the
# PulseOps workflow on its own. Only the image pin changed (2.41.6 instead of `latest`). It uses the same container name
# and port as the canonical stack, so run one or the other. Remove it once docker-compose.yml is accepted.
services:
  n8n:
    image: docker.n8n.io/n8nio/n8n:2.41.6
    container_name: pulseops-n8n
    ports:
      - "5678:5678"
    environment:
      N8N_HOST: localhost
      WEBHOOK_URL: http://localhost:5678/
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_PERSONALIZATION_ENABLED: "false"
      GENERIC_TIMEZONE: UTC
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - n8n_data:/home/node/.n8n
      - ./n8n:/workflows:ro

volumes:
  n8n_data:
